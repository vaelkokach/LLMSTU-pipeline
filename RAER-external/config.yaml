# RAER external task config.
#
# The labeling half of this file MUST stay byte-identical to the values locked in
# LLMSTU-pipeline/config.yaml, or the two tasks are no longer comparable. Anything
# that differs belongs under `raer:`, not under `caption:`.

source:
  # Swap when official access is granted; nothing else changes.
  kind: kaggle                       # kaggle | official
  kaggle_dataset: bearmn/raer-video-emotion-dataset
  official_root: ""                  # path to the authorised copy, once we have it
  local_media: /content/raer         # media stays on the runtime disk
  drive_artifacts: /content/drive/MyDrive/RAER   # derived artifacts only

# Pin the exact labeler that produced a run. Fill in after stage 00.
llmstu_pipeline:
  commit: ""                         # git rev of LLMSTU-pipeline used for this run

caption:
  # --- copied verbatim from LLMSTU-pipeline/config.yaml — do not tune here ---
  model_id: Qwen/Qwen3.5-27B
  backend: transformers
  dtype: bfloat16
  load_in_4bit: false
  attn_implementation: sdpa
  prompt_name: v2_concise
  schema_name: full
  enable_thinking: false
  max_new_tokens: 512
  batch_size: 48
  max_pixels: 802816
  temperature: 0.0

raer:
  frames_per_clip: 8                 # uniformly sampled per clip; see stage 01
  use_existing_frames: true          # reuse the mirror's ~31 pre-extracted jpgs if usable
  label_input: full_frame            # full_frame | upper_body_crop
                                     #   full_frame keeps the context (phone, book, desk)
                                     #   that RAER's distraction class depends on
  split_key: identity_key            # NEVER 'person' unless stage 00 proves it is global
  test_frac: 0.2
  seed: 13

golden:
  n_clips: 200                       # human-audited subset for the 3-way comparison
  stratify_by: raer_label            # so confusion (1.4%) is actually represented
  min_per_class: 25
  hard_frac: 0.2                     # lowest mean model_confidence

publish:
  # Hard off. RAER media and derivatives may not be redistributed.
  push_media_to_hub: false

<!doctype html>
<meta charset="utf-8">
<title>RAER three-way review</title>
<style>
 :root{--bg:#fff;--fg:#111;--mut:#666;--line:#ddd;--accent:#0a58ca;--good:#0a7d33;--warn:#a86500;--bad:#b3261e;--card:#fafafa}
 @media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e9e9ea;--mut:#9aa0a6;--line:#33363b;--accent:#7aa7ff;--good:#5cc47f;--warn:#e0a942;--bad:#f28b82;--card:#1c1f23}}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
 header{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.6rem .9rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
 button{font:inherit;padding:.35rem .7rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
 button:hover{border-color:var(--accent)}
 button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
 button.good{background:var(--good);color:#fff;border-color:var(--good)}
 .pill{padding:.2rem .55rem;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--mut)}
 .bar{height:3px;background:var(--line)}.bar>div{height:100%;background:var(--accent);width:0}
 .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:1rem;padding:1rem;align-items:start}
 @media(max-width:900px){.wrap{grid-template-columns:1fr}}
 .strip{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
 .strip img{width:100%;border-radius:6px;border:1px solid var(--line);display:block}
 .card{border:1px solid var(--line);border-radius:8px;padding:.75rem;margin-bottom:.8rem;background:var(--card)}
 .card h3{margin:0 0 .5rem;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
 .row{display:grid;grid-template-columns:11rem 1fr;gap:.4rem;align-items:center;margin-bottom:.35rem}
 .row label{color:var(--mut);font-size:13px}
 select,.toggle{font:inherit;padding:.25rem .4rem;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);width:100%}
 .edited select,.edited .toggle{outline:2px solid var(--warn)}
 .share{font-size:11px;color:var(--mut);margin-left:.3rem}
 .verdict{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
 .verdict button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
 .big{font-size:1.15rem;font-weight:600}
 .muted{color:var(--mut);font-size:12px}
 .drop{padding:3rem 1rem;text-align:center}
 kbd{border:1px solid var(--line);border-radius:4px;padding:0 .3rem;font-size:11px}
</style>

<header>
  <span id="counter" class="pill"></span>
  <span id="groupPill" class="pill"></span>
  <button id="prev">← Prev</button>
  <button id="next" class="primary">Next →</button>
  <button id="agree" class="good">✓ All correct <kbd>v</kbd></button>
  <button id="reset">Reset to model</button>
  <button id="loadProg">Load progress</button>
  <button id="export" class="good">Export golden.json</button>
  <input type="file" id="progFile" accept="application/json" hidden>
</header>
<div class="bar"><div id="progbar"></div></div>

<div class="wrap" id="app" hidden>
  <div>
    <div class="strip" id="strip"></div>
    <p class="muted" id="meta"></p>
  </div>
  <div>
    <div class="card">
      <h3>1 · RAER's label — does it fit?</h3>
      <p class="big" id="raerLabel"></p>
      <div class="verdict" id="raerVerdict"></div>
      <div id="raerCorrectWrap" hidden>
        <label class="muted">Which label fits better?</label>
        <select id="raerCorrect"></select>
      </div>
    </div>
    <div class="card">
      <h3>2 · Our cue labels — correct any that are wrong</h3>
      <div id="fields"></div>
    </div>
    <div class="card">
      <h3>Model notes</h3>
      <p class="muted" id="notes"></p>
    </div>
  </div>
</div>

<div class="wrap drop" id="drop">
  <div>
    <h2>RAER three-way review</h2>
    <p class="muted">Load the <code>data.json</code> built by stage 04.</p>
    <input type="file" id="file" accept="application/json">
    <p class="muted"><kbd>←</kbd>/<kbd>→</kbd> move · <kbd>v</kbd> accept everything ·
      progress is saved in this browser automatically</p>
  </div>
</div>

<script>
const S={items:[],fields:null,classes:[],idx:0,work:{}};
const $=s=>document.querySelector(s);

function key(){
  const sig=S.items.map(i=>i.clip_stem).join('|');
  let h=0; for(let i=0;i<sig.length;i++){h=(h*31+sig.charCodeAt(i))|0;}
  return 'raer3way:'+S.items.length+':'+h;
}
const persist=()=>{try{localStorage.setItem(key(),JSON.stringify(S.work))}catch(e){}};
const restore=()=>{try{S.work=JSON.parse(localStorage.getItem(key()))||{}}catch(e){S.work={}}};

function load(d){
  S.items=d.items||[]; S.fields=d.fields||{}; S.classes=d.raer_classes||[];
  restore(); buildForm(); buildVerdict();
  $('#drop').hidden=true; $('#app').hidden=false; S.idx=0; render();
}
function cur(){return S.items[S.idx];}
function rec(){
  const it=cur();
  if(!S.work[it.clip_stem]) S.work[it.clip_stem]={cues:{...it.pseudo},raer:'',raer_correct:'',status:'unseen'};
  return S.work[it.clip_stem];
}
function buildForm(){
  const box=$('#fields'); box.innerHTML='';
  for(const [name,spec] of Object.entries(S.fields)){
    const row=document.createElement('div'); row.className='row'; row.dataset.f=name;
    const lab=document.createElement('label'); lab.textContent=name.replace(/_/g,' ');
    let el;
    if(spec.type==='enum'){
      el=document.createElement('select');
      for(const v of spec.values){const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);}
    }else{
      el=document.createElement('select'); el.className='toggle';
      for(const v of ['false','true']){const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);}
    }
    el.dataset.f=name;
    el.addEventListener('change',()=>{
      const r=rec();
      r.cues[name]= S.fields[name].type==='bool' ? el.value==='true' : el.value;
      r.status='edited'; persist(); paint();
    });
    const cell=document.createElement('div'); cell.appendChild(el);
    const sh=document.createElement('span'); sh.className='share'; sh.dataset.share=name; cell.appendChild(sh);
    row.append(lab,cell); box.appendChild(row);
  }
}
function buildVerdict(){
  const box=$('#raerVerdict'); box.innerHTML='';
  for(const [v,txt] of [['agree','✓ Fits'],['disagree','✗ Wrong label'],['unclear','? Unclear']]){
    const b=document.createElement('button'); b.textContent=txt; b.dataset.v=v;
    b.addEventListener('click',()=>{
      const r=rec(); r.raer=v; if(r.status==='unseen') r.status='reviewed';
      $('#raerCorrectWrap').hidden = v!=='disagree';
      persist(); paint();
    });
    box.appendChild(b);
  }
  const sel=$('#raerCorrect'); sel.innerHTML='';
  for(const c of ['',...S.classes]){const o=document.createElement('option');o.value=c;o.textContent=c||'(pick one)';sel.appendChild(o);}
  sel.addEventListener('change',()=>{const r=rec();r.raer_correct=sel.value;persist();});
}
function render(){
  const it=cur();
  $('#strip').innerHTML=it.frames.map(f=>`<img src="${f}" loading="lazy">`).join('');
  $('#meta').textContent=`${it.clip_stem} · ${it.identity_key} · ${it.n_frames||'?'} frames labeled`;
  $('#raerLabel').textContent=it.raer_label||'(no label)';
  $('#notes').textContent=
    `confidence ${it.model_confidence==null?'—':(+it.model_confidence).toFixed(2)} · `+
    `cue instability ${it.cue_instability==null?'—':it.cue_instability} · ${it.caption||''}`;
  $('#groupPill').textContent=it.group;
  paint();
}
function paint(){
  const it=cur(), r=rec();
  for(const [name,spec] of Object.entries(S.fields)){
    const sel=$('#fields').querySelector(`select[data-f="${name}"]`);
    const v=r.cues[name];
    sel.value = spec.type==='bool' ? String(!!v) : (v==null?'':String(v));
    const changed = String(v)!==String(it.pseudo[name]);
    sel.closest('.row').classList.toggle('edited',changed);
    const sh=$('#fields').querySelector(`[data-share="${name}"]`);
    const s=it.shares?it.shares[name]:null;
    sh.textContent = s==null?'':`${Math.round(s*100)}% of frames`;
  }
  for(const b of $('#raerVerdict').children) b.classList.toggle('sel', b.dataset.v===r.raer);
  $('#raerCorrectWrap').hidden = r.raer!=='disagree';
  $('#raerCorrect').value=r.raer_correct||'';
  const done=Object.values(S.work).filter(w=>w.status!=='unseen').length;
  $('#counter').textContent=`${S.idx+1} / ${S.items.length} · ${done} reviewed`;
  $('#progbar').style.width=(100*done/S.items.length)+'%';
}
function move(d){S.idx=Math.min(S.items.length-1,Math.max(0,S.idx+d));render();}

$('#next').onclick=()=>move(1);
$('#prev').onclick=()=>move(-1);
$('#reset').onclick=()=>{const it=cur(),r=rec();r.cues={...it.pseudo};r.status='reviewed';persist();paint();};
$('#agree').onclick=()=>{const r=rec();r.raer=r.raer||'agree';r.status='verified';persist();paint();move(1);};
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowRight')move(1); else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='v')$('#agree').click();
});
$('#file').onchange=e=>{const f=e.target.files[0];const r=new FileReader();r.onload=()=>load(JSON.parse(r.result));r.readAsText(f);};
$('#loadProg').onclick=()=>$('#progFile').click();
$('#progFile').onchange=e=>{const f=e.target.files[0];const r=new FileReader();
  r.onload=()=>{const g=JSON.parse(r.result);for(const it of (g.items||[])){
    S.work[it.clip_stem]={cues:it.golden||{},raer:it.raer_verdict||'',raer_correct:it.raer_correct||'',status:it.status||'reviewed'};}
    persist();render();};r.readAsText(f);};
$('#export').onclick=()=>{
  const items=S.items.map(it=>{const w=S.work[it.clip_stem];
    return {clip_stem:it.clip_stem,identity_key:it.identity_key,group:it.group,
            raer_label:it.raer_label,raer_verdict:w?w.raer:'',raer_correct:w?w.raer_correct:'',
            pseudo:it.pseudo,golden:w?w.cues:it.pseudo,status:w?w.status:'unseen'};});
  const blob=new Blob([JSON.stringify({items},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='golden.json';a.click();
};
</script>
